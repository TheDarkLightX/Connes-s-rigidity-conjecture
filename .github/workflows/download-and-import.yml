name: Download and import Lean research bundle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download exact source artifact
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-7770-820a-92d1-eaecf7c5f3a8/raw?se=2026-08-04T08:53:05Z&sp=r&sv=2026-02-06&sr=b&scid=8c4928f7-27c3-5851-bae0-061bd11e040a&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T22:58:20Z&ske=2026-08-04T22:58:20Z&sks=b&skv=2026-02-06&sig=Pr3L6Mb9LNchaMABq2VhCkdszfXTeLQXwERJbrENNTU%3D'
          curl --fail --location --retry 3 "$url" --output /tmp/connes-export-artifact.zip
          echo '25f677da9f1a988bcecb65266beb0cb6ebfa42810b7c202560e9684399990e44  /tmp/connes-export-artifact.zip' | sha256sum --check

      - name: Extract and prepare standalone project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/connes-artifact
          mkdir -p /tmp/connes-artifact docs paper
          unzip -q /tmp/connes-export-artifact.zip -d /tmp/connes-artifact
          inner="$(find /tmp/connes-artifact -type f -name 'connes-rigidity-lean-export.tar.gz' -print -quit)"
          test -n "$inner"
          tar -xzf "$inner" -C .
          source_sha="$(tr -d '\r\n' < SOURCE_COMMIT)"
          module_count="$(find LeanMathlib/Rigidity -maxdepth 1 -type f -name '*.lean' | wc -l | tr -d ' ')"
          python3 - <<'PY'
          from pathlib import Path
          modules = sorted(p.stem for p in Path('LeanMathlib/Rigidity').glob('*.lean'))
          Path('LeanMathlib.lean').write_text(
              '\n'.join(f'import LeanMathlib.Rigidity.{m}' for m in modules) + '\n',
              encoding='utf-8')
          PY
          cat > docs/PROVENANCE.md <<EOF
          # Provenance

          - Source repository: `TheDarkLightX/MathLib`
          - Source project: `workspaces/lean_mathlib`
          - Exported source commit: `${source_sha}`
          - Imported modules: `${module_count}`
          - Artifact SHA-256: `25f677da9f1a988bcecb65266beb0cb6ebfa42810b7c202560e9684399990e44`
          - Import date: 2026-08-04

          The source files were transferred through a checksum-verified GitHub Actions artifact and extracted without semantic rewriting.
          EOF
          cat > docs/THEOREM_STATUS.md <<'EOF'
          # Theorem status

          ## Lean-checked components

          - Canonical group-like elements of a group algebra recover the original group.
          - Bialgebra equivalence of canonical group algebras induces group isomorphism.
          - Quantitative metric rounding hypotheses yield multiplicative equivalence.
          - Nonzero divided cubes in the rank-three polynomial tensor module have infinite orbit under explicit elementary transvections.
          - Ternary Witt carries define normalized symmetric cocycles and shifted abelian extensions.
          - Polynomial shears act compatibly on the shifted carry groups.
          - The Frobenius diagonal and multiplication-by-three identities are formalized.
          - The ternary reduced degree-three minimum-support bound is proved internally.
          - Primitive-count and shifted-dual-kernel modules formalize the proposed finite-invariant arithmetic.

          ## Still open in this repository

          - A completed family of pairwise nonisomorphic ICC property-(T) groups with isomorphic group von Neumann algebras.
          - The complete spectral-measure/property-(T) transfer.
          - The intrinsic finite-conjugacy invariant in the final groups.
          - Pontryagin-dual, Haar-measure, crossed-product, and spatial von Neumann-algebra bridges.
          - Common complex group rings and full/reduced group C*-algebras for the final family.
          EOF
          cat > docs/RESEARCH_ROADMAP.md <<'EOF'
          # Research roadmap

          1. Complete the ternary spectral detector and property-(T) transfer.
          2. Prove finite generation and ICC for the final semidirect products.
          3. Close the intrinsic 3-torsion and finite-orbit invariant.
          4. Construct compact dual actions, Haar transport, crossed products, and common group factors.
          5. Formalize analytic Hopf-defect stability in group von Neumann algebras.
          6. Investigate common group rings and full/reduced group C*-algebras.
          7. Obtain independent group-theory and operator-algebra review before a complete counterexample claim.
          EOF
          cat > README.md <<EOF
          # Connes's Rigidity Conjecture — Formal Research Program

          This repository is the canonical public home for Lean formalizations, adversarial audits, and new mathematical work related to Connes's rigidity conjecture and the OpenAI/Codex counterexample program.

          The standalone project currently contains **${module_count} Lean modules** imported from source commit `${source_sha}`.

          ## Claim boundary

          This repository does **not yet claim a completed new counterexample to Connes's rigidity conjecture**. See [docs/THEOREM_STATUS.md](docs/THEOREM_STATUS.md) and [docs/RESEARCH_ROADMAP.md](docs/RESEARCH_ROADMAP.md).

          ## Build

          ```bash
          lake build
          ```
          EOF
          cat > paper/README.md <<'EOF'
          # Paper workspace

          The first focused manuscript should center on the Lean-verified rank-three divided-cube orbit theorem and its exponent-support proof. The broader ternary construction remains a research program until the property-(T), ICC, intrinsic-invariant, and operator-algebra bridges are closed.
          EOF
          cat > CITATION.cff <<'EOF'
          cff-version: 1.2.0
          message: "If you use this formalization, cite the tagged repository release and associated preprint."
          title: "Connes's Rigidity Conjecture Formal Research Program"
          type: software
          authors:
            - family-names: Edwards
              given-names: Dana
          repository-code: "https://github.com/TheDarkLightX/Connes-s-rigidity-conjecture"
          license: MIT
          version: 0.1.0-dev
          date-released: 2026-08-04
          EOF
          rm -f SOURCE_COMMIT .import-trigger
          rm -f .github/workflows/import-research.yml
          rm -f .github/workflows/import-on-pr.yml
          rm -f .github/workflows/extract-import.yml
          rm -f .github/workflows/download-and-import.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Lean-checked Connes rigidity research'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
