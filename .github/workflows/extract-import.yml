name: Extract imported Lean research

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          archive='import/connes-rigidity-lean-export-artifact.zip'
          if [ ! -f "$archive" ]; then
            echo 'Import archive not present yet; nothing to extract.'
            exit 0
          fi

          rm -rf _artifact
          mkdir -p _artifact docs paper
          unzip -q "$archive" -d _artifact
          inner="$(_artifact_find=$(find _artifact -type f -name 'connes-rigidity-lean-export.tar.gz' -print -quit); printf '%s' "$_artifact_find")"
          test -n "$inner"
          tar -xzf "$inner" -C .

          source_sha="$(tr -d '\r\n' < SOURCE_COMMIT)"
          module_count="$(find LeanMathlib/Rigidity -maxdepth 1 -type f -name '*.lean' | wc -l | tr -d ' ')"

          python3 - <<'PY'
          from pathlib import Path
          root = Path('LeanMathlib/Rigidity')
          modules = sorted(p.stem for p in root.glob('*.lean'))
          Path('LeanMathlib.lean').write_text(
              '\n'.join(f'import LeanMathlib.Rigidity.{m}' for m in modules) + '\n',
              encoding='utf-8')
          PY

          cat > README.md <<EOF
          # Connes's Rigidity Conjecture — Formal Research Program

          This repository is the canonical public home for Lean formalizations, adversarial audits, and new mathematical work related to Connes's rigidity conjecture and the OpenAI/Codex counterexample program.

          ## Current formalization

          The project contains **${module_count} Lean modules** covering:

          - exact group reconstruction from canonical group-algebra Hopf structure;
          - quantitative approximate group-like and Hopf-rounding theorems;
          - a rank-three infinite-orbit theorem for divided cubes over polynomial rings;
          - ternary Witt carries and shifted abelian cocycle extensions;
          - Frobenius-diagonal and multiplication-by-three identities;
          - an internal Lean proof of the ternary degree-three minimum-support bound;
          - primitive-vector, dual-shift-kernel, and proposed distinguishing-invariant arithmetic.

          ## Claim boundary

          This repository does **not yet claim a completed new counterexample to Connes's rigidity conjecture**. See [Theorem status](docs/THEOREM_STATUS.md) and the [Research roadmap](docs/RESEARCH_ROADMAP.md).

          ## Build

          ```bash
          lake build
          ```

          ## Provenance

          The initial formalization was imported byte-for-byte from `TheDarkLightX/MathLib` source commit `${source_sha}`. See [docs/PROVENANCE.md](docs/PROVENANCE.md).
          EOF

          cat > docs/PROVENANCE.md <<EOF
          # Provenance

          - Source repository: `TheDarkLightX/MathLib`
          - Source path: `workspaces/lean_mathlib/`
          - Source commit recorded by export: `${source_sha}`
          - Destination repository: `TheDarkLightX/Connes-s-rigidity-conjecture`
          - Imported Lean modules: `${module_count}`
          - Import date: 2026-08-04
          - Transfer method: private-source GitHub Actions artifact, downloaded through the connected GitHub app and committed as an exact binary bundle before extraction

          The source project had passed its Mathlib CI. The destination runs an independent standalone Lean build.
          EOF

          cat > docs/THEOREM_STATUS.md <<'EOF'
          # Theorem status

          ## Lean-checked components

          - Canonical group-like elements of a group algebra recover the original group.
          - Bialgebra equivalence of canonical group algebras induces group isomorphism.
          - Quantitative rounding hypotheses yield multiplicative equivalence.
          - Every nonzero divided cube in the formalized rank-three polynomial tensor module has infinite orbit under explicit elementary transvections.
          - Ternary Witt carry identities define normalized symmetric cocycles and shifted abelian extensions.
          - Polynomial shears act compatibly on the shifted carry groups.
          - The Frobenius diagonal recovers pure-cube sources and is natural under the formalized actions.
          - Multiplication by three is governed by the shifted Frobenius-dual map; the extension has exponent dividing nine.
          - The ternary reduced degree-three minimum-support bound is proved internally in Lean.
          - Primitive-count, low-degree dual-coordinate, and shifted-kernel modules formalize the proposed finite invariant arithmetic.

          ## Not yet promoted as a complete result

          - A completed family of pairwise nonisomorphic ICC property-(T) groups with isomorphic group von Neumann algebras.
          - The full ternary spectral-measure/property-(T) transfer.
          - The intrinsic finite-conjugacy invariant in the final abstract groups.
          - The final Pontryagin-dual, Haar-measure, crossed-product, and spatial von Neumann-algebra bridges.
          - Common complex group rings and full/reduced group C*-algebras for the completed family.
          EOF

          cat > docs/RESEARCH_ROADMAP.md <<'EOF'
          # Research roadmap

          1. Complete the ternary finite detector and invariant spectral-measure transfer.
          2. Prove property (T), finite generation, and ICC for the final semidirect products.
          3. Identify the intrinsic three-torsion/finite-orbit subgroup and certify its cardinality in the abstract groups.
          4. Construct the compact dual action, Haar transport, crossed products, and common group factors.
          5. Formalize the analytic approximate group-like lemma and quantitative Hopf-defect lower bound.
          6. Investigate common complex group rings and full/reduced group C*-algebras.
          7. Obtain independent group-theory, formal-methods, and operator-algebra reviews before a complete counterexample claim.
          EOF

          cat > paper/README.md <<'EOF'
          # Paper workspace

          The first focused manuscript should present the Lean-verified rank-three divided-cube orbit theorem and its exponent-support proof. The broader ternary Connes-rigidity construction remains a research program until its property-(T), ICC, intrinsic-invariant, and operator-algebra bridges are closed.
          EOF

          cat > CITATION.cff <<'EOF'
          cff-version: 1.2.0
          message: "If you use this formalization, cite the tagged repository release and associated preprint."
          title: "Connes's Rigidity Conjecture Formal Research Program"
          type: software
          authors:
            - family-names: Edwards
              given-names: Dana
          repository-code: "https://github.com/TheDarkLightX/Connes-s-rigidity-conjecture"
          license: MIT
          version: 0.1.0-dev
          date-released: 2026-08-04
          EOF

          rm -rf _artifact import
          rm -f SOURCE_COMMIT .import-trigger
          rm -f .github/workflows/import-research.yml
          rm -f .github/workflows/import-on-pr.yml
          rm -f .github/workflows/extract-import.yml

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No extraction changes.'
            exit 0
          fi
          git commit -m 'Import Lean-checked Connes rigidity research'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
