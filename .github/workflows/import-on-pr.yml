name: Import Lean research on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check out source research
        uses: actions/checkout@v5
        with:
          repository: TheDarkLightX/MathLib
          ref: agent/connes-rigidity-hopf-witt-20260803
          path: _source

      - name: Copy exact Lean modules
        shell: bash
        run: |
          set -euo pipefail
          rm -rf LeanMathlib/Rigidity
          mkdir -p LeanMathlib/Rigidity docs
          cp -R _source/workspaces/lean_mathlib/LeanMathlib/Rigidity/. LeanMathlib/Rigidity/
          python3 - <<'PY'
          from pathlib import Path
          modules = sorted(p.stem for p in Path('LeanMathlib/Rigidity').glob('*.lean'))
          Path('LeanMathlib.lean').write_text(
              '\n'.join(f'import LeanMathlib.Rigidity.{m}' for m in modules) + '\n',
              encoding='utf-8')
          PY
          source_sha="$(git -C _source rev-parse HEAD)"
          count="$(find LeanMathlib/Rigidity -name '*.lean' -maxdepth 1 | wc -l | tr -d ' ')"
          printf '# Import provenance\n\n- Source: `TheDarkLightX/MathLib`\n- Branch: `agent/connes-rigidity-hopf-witt-20260803`\n- Commit: `%s`\n- Modules: `%s`\n- Imported: 2026-08-04\n' "$source_sha" "$count" > docs/IMPORT_PROVENANCE.md
          rm -rf _source
          rm -f .import-trigger .github/workflows/import-research.yml .github/workflows/import-on-pr.yml

      - name: Commit import
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Lean rigidity modules from MathLib'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
