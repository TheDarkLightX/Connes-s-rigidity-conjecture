name: One-shot Lean research import

on:
  push:
    branches:
      - agent/import-lean-rigidity-research-20260804

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v5
        with:
          ref: agent/import-lean-rigidity-research-20260804
          fetch-depth: 0

      - name: Check out source research branch
        uses: actions/checkout@v5
        with:
          repository: TheDarkLightX/MathLib
          ref: agent/connes-rigidity-hopf-witt-20260803
          path: _source

      - name: Import formalization and research metadata
        shell: bash
        run: |
          set -euo pipefail

          source_root="_source/workspaces/lean_mathlib/LeanMathlib/Rigidity"
          test -d "$source_root"

          rm -rf LeanMathlib/Rigidity
          mkdir -p LeanMathlib/Rigidity docs paper
          cp -R "$source_root"/. LeanMathlib/Rigidity/

          python3 - <<'PY'
          from pathlib import Path

          root = Path("LeanMathlib/Rigidity")
          modules = sorted(p.stem for p in root.glob("*.lean"))
          text = "\n".join(f"import LeanMathlib.Rigidity.{name}" for name in modules) + "\n"
          Path("LeanMathlib.lean").write_text(text, encoding="utf-8")
          PY

          source_sha="$(git -C _source rev-parse HEAD)"
          module_count="$(find LeanMathlib/Rigidity -maxdepth 1 -type f -name '*.lean' | wc -l | tr -d ' ')"

          cat > README.md <<EOF
          # Connes's Rigidity Conjecture — Formal Research Program

          This repository is the canonical public home for Lean formalizations, adversarial audits, and new mathematical work related to Connes's rigidity conjecture and the OpenAI/Codex counterexample program.

          ## Current scope

          The imported development contains **${module_count} Lean modules** covering:

          - exact reconstruction of a group from the group-like elements of its canonical group-algebra Hopf structure;
          - quantitative approximate group-like and Hopf-rounding theorems;
          - a rank-three infinite-orbit theorem for divided cubes over polynomial rings;
          - ternary length-two Witt carries and shifted cocycle extensions;
          - Frobenius-diagonal and multiplication-by-three identities;
          - a Lean proof of the ternary degree-three minimum-support bound;
          - primitive-vector and shifted-dual-kernel arithmetic for the proposed rank-three construction.

          ## Claim boundary

          This repository does **not yet claim a completed new counterexample to Connes's rigidity conjecture**. The strongest completed components are tracked in [docs/THEOREM_STATUS.md](docs/THEOREM_STATUS.md). Remaining analytic, property-(T), ICC, intrinsic-invariant, and operator-algebra bridges are listed in [docs/RESEARCH_ROADMAP.md](docs/RESEARCH_ROADMAP.md).

          ## Build

          ```bash
          lake build
          ```

          The project pins the same Lean and Mathlib dependency graph used by the source CI-checked workspace.

          ## Provenance

          The first import was copied byte-for-byte from source commit `${source_sha}` on `TheDarkLightX/MathLib`, branch `agent/connes-rigidity-hopf-witt-20260803`. See [docs/PROVENANCE.md](docs/PROVENANCE.md).
          EOF

          cat > docs/PROVENANCE.md <<EOF
          # Provenance

          ## Initial Lean import

          - Source repository: `TheDarkLightX/MathLib`
          - Source branch: `agent/connes-rigidity-hopf-witt-20260803`
          - Source commit: `${source_sha}`
          - Source draft PR: `TheDarkLightX/MathLib#1`
          - Imported module directory: `workspaces/lean_mathlib/LeanMathlib/Rigidity/`
          - Destination module directory: `LeanMathlib/Rigidity/`
          - Imported module count: `${module_count}`
          - Import date: 2026-08-04

          The source head had passed its Mathlib GitHub Actions build before migration. Files were copied without semantic rewriting; the module namespace remains `LeanMathlib.Rigidity` so the original import graph is preserved.
          EOF

          cat > docs/THEOREM_STATUS.md <<'EOF'
          # Theorem Status

          Status labels distinguish machine-checked components from research objectives.

          ## Lean-checked in the imported development

          - Canonical group-algebra group-like elements recover the original group.
          - A bialgebra equivalence between canonical group algebras induces a group isomorphism.
          - Quantitative metric rounding conditions imply a multiplicative equivalence.
          - Nonzero divided cubes in the rank-three polynomial tensor cube have infinite orbit under explicit elementary transvections.
          - The ternary Witt carry is a normalized symmetric additive cocycle and defines shifted abelian extensions.
          - Polynomial shears act compatibly on the shifted carry groups.
          - The Frobenius diagonal sends pure cubes back to their source vectors and is natural under the formalized actions.
          - Multiplication by three in the shifted carry extension is governed by the shifted Frobenius-dual map; the extension has exponent dividing nine.
          - Every nonzero reduced degree-at-most-three ternary polynomial has relative support at least 2/9 in the formalized finite model.
          - Primitive-count and shifted-dual-kernel modules encode the proposed 3^(3n) distinguishing arithmetic.

          ## Not yet a completed theorem in this repository

          - A complete new family of pairwise nonisomorphic ICC property-(T) groups with isomorphic group von Neumann algebras.
          - The full spectral-measure/property-(T) transfer for the ternary rank-three groups.
          - The complete intrinsic finite-conjugacy invariant inside the final abstract groups.
          - The Pontryagin-dual topology, Haar-measure, crossed-product, and spatial von Neumann-algebra equivalences for the final family.
          - Common complex group rings and full/reduced group C*-algebras for the final family.

          Every public paper or website should preserve this boundary until the missing bridges are formalized and independently reviewed.
          EOF

          cat > docs/RESEARCH_ROADMAP.md <<'EOF'
          # Research Roadmap

          ## A. Referee and semantic-adequacy layer

          1. Independently restate ICC, property (T), group von Neumann algebra, and spatial trace-preserving equivalence.
          2. Prove bridges from the construction-specific definitions to those reference definitions.
          3. Close the universe-independence bridge for property (T) of countable groups.

          ## B. Ternary rank-three construction

          1. Integrate the 2/9 minimum-support theorem with the primitive-vector count.
          2. Port the finite detector and invariant spectral-measure argument.
          3. Prove property (T), finite generation, and ICC for the completed semidirect products.
          4. Identify the intrinsic three-torsion/finite-orbit subgroup and prove its size is 3^(3n).
          5. Construct the common compact action, Haar transport, crossed products, and group factors.

          ## C. Stronger reconstruction results

          1. Formalize the analytic approximate group-like lemma in group von Neumann algebras.
          2. Derive an explicit Hopf-defect lower bound for isomorphisms between factors of nonisomorphic groups.
          3. Investigate common complex group rings and full/reduced group C*-algebras.
          4. Prove that the canonical coproducts are pairwise nonconjugate and quantify their separation.

          ## D. Publication gates

          - All headline theorem dependencies compile from a tagged commit.
          - No hidden axioms, `sorry`, or untracked semantic assumptions in the promoted theorem chain.
          - Independent mathematical review of the rank-three orbit theorem and ternary detector.
          - Operator-algebra review before making any complete Connes-counterexample claim.
          EOF

          cat > paper/README.md <<'EOF'
          # Paper workspace

          The first focused manuscript should center on the Lean-verified rank-three divided-cube orbit theorem and its exponent-support proof. A broader ternary Connes-rigidity manuscript should remain explicitly a work toward a complete construction until the property-(T), ICC, intrinsic-invariant, and operator-algebra bridges are closed.
          EOF

          cat > CITATION.cff <<'EOF'
          cff-version: 1.2.0
          message: "If you use this formalization, cite the tagged repository release and associated preprint."
          title: "Connes's Rigidity Conjecture Formal Research Program"
          type: software
          authors:
            - family-names: Edwards
              given-names: Dana
          repository-code: "https://github.com/TheDarkLightX/Connes-s-rigidity-conjecture"
          license: MIT
          version: 0.1.0-dev
          date-released: 2026-08-04
          EOF

          cat > LICENSE <<'EOF'
          MIT License

          Copyright (c) 2026 Dana Edwards

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          EOF

          rm -rf _source
          rm -f .github/workflows/import-research.yml

      - name: Commit imported research
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No import changes"
            exit 0
          fi
          git commit -m "Import Lean rigidity research from MathLib"
          git push origin HEAD:agent/import-lean-rigidity-research-20260804
