name: Lean formalization PR gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'LeanMathlib/**'
      - 'LeanMathlib.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require the formal project in the checked-out PR
        run: |
          test -f lakefile.lean
          test -f lean-toolchain
          test -f LeanMathlib.lean
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
