name: Exact full Lean rigidity recheck

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/rigidity-full-ci-20260804
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
